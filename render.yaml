services:
  - type: web
    name: clout
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn clout.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: clout-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: clout.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://clout.onrender.com

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: EMAIL_HOST
        value: smtp.privateemail.com

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        value: admin@clout.courses

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "Clout <admin@clout.courses>"


databases:
  - name: clout-db
    plan: free