services:
  - type: web
    name: clout
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn clout.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 300

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: clout-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: clout.onrender.com,clout.courses,www.clout.courses

      - key: CSRF_TRUSTED_ORIGINS
        value: https://clout.onrender.com,https://clout.courses,https://www.clout.courses

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: GROQ_API_KEY
        sync: false

      # Durable object storage for uploaded images and videos.
      - key: USE_S3
        value: "True"

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        value: clout

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      - key: EMAIL_HOST
        value: smtp.privateemail.com

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        value: admin@clout.courses

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "Clout <admin@clout.courses>"


databases:
  - name: clout-db
    plan: free