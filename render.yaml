databases:
  - name: clout-db
    databaseName: clout_db
    user: clout
    plan: free

services:
  - type: web
    name: clout
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh

    # Persistent 10GB Disk for uploaded videos, thumbnails, avatars, and persistent data
    disk:
      name: clout-persistent-data
      mountPath: /var/data
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: PERSISTENT_DATA_DIR
        value: /var/data

      - key: DATABASE_URL
        fromDatabase:
          name: clout-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: clout.onrender.com,clout.courses,www.clout.courses

      - key: CSRF_TRUSTED_ORIGINS
        value: https://clout.onrender.com,https://clout.courses,https://www.clout.courses

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM_EMAIL
        value: "Clout <noreply@clout.courses>"

      # Optional Cloudflare R2 / S3 Object Storage (if provided, otherwise persistent disk is used)
      - key: USE_S3
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        value: clout

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      - key: EMAIL_HOST
        value: smtp.gmail.com

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        value: support@clout.courses

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "Clout <noreply@clout.courses>"
