<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLOUT – Reset Link Sent</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #E04F00;
            --success: #E04F00;
            --black: #020202;
            --white: #FFFFFF;
            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;
            --body: "DM Sans", sans-serif;
        }

        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: var(--black);

            display: flex;

            flex-direction: column;
        }


        .navbar {
            height: 62px;

            background: var(--black);

            border-top: 1px solid var(--orange);

            border-bottom: 1px solid rgba(255,255,255,.08);

            display: flex;

            align-items: center;
        }

        .nav-container {
            width: min(1380px, calc(100% - 50px));

            margin: auto;
        }

        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: white;
        }


        .card {
            width: 100%;

            max-width: 520px;

            padding: 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;

            text-align: center;
        }


        .success-illustration {
            display: flex;
            justify-content: center;
            margin: 0 auto 18px;
        }

        .success-illustration svg {
            width: 170px;
            height: 130px;
        }


        .title {
            font-size: 28px;

            margin-bottom: 12px;

            font-family: var(--heading);
        }


        .description {
            color: #536071;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .email-box {
            background: #f7f7f7;

            border: 1px solid #e5e5e5;

            border-radius: 6px;

            padding: 12px;

            font-size: 14px;

            margin-bottom: 22px;

            word-break: break-word;
        }


        .button {
            display: block;

            width: 100%;

            height: 48px;

            background: var(--success);

            font-family: var(--body);

            color: white;

            border: none;
            

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;

            line-height: 48px;
        }


        .button:hover {
            background: #C2410C;
        }

        .button-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -4px;
            fill: currentColor;
        }


        .resend {
            margin-top: 18px;

            font-size: 13px;

            color: #536071;
        }

        .resend-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 22px 0;
            padding: 16px;
            border-radius: 10px;
            background: #FFF7F2;
            color: #536071;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
        }

        .resend-box svg {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            margin-top: 1px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #536071;
            font-size: 16px;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--success);
        }


        .link {
            color: var(--orange);

            text-decoration: none;

            font-weight: 500;
        }


        .footer {
            height: 80px;

            background: var(--off-white);

            border-top: 1px solid #e3e3e3;
        }


        .footer-container {
            width: min(950px, calc(100% - 48px));

            margin: auto;
        }


        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width: calc(100% - 36px);
            }

            .card {
                padding: 28px 20px;
            }

            .title {
                font-size: 24px;
            }

            .copyright {
                font-size: 13px;
            }

        }

    </style>

<link rel="stylesheet" href="/static/responsive.css">
</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a href="{% url 'index' %}" class="logo">
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">

            <div class="success-illustration" aria-hidden="true">
                <svg viewBox="0 0 170 130">
                    <circle cx="85" cy="56" r="42" fill="#FFF0E8" />
                    <path d="M42 42h86v61H42z" fill="#FFF" stroke="#F5B9A0" stroke-width="2" />
                    <path d="m43 43 42 34 42-34" fill="#FFF8F4" stroke="#F5B9A0" stroke-width="2" />
                    <path d="M53 57h29M53 68h41M53 79h34" stroke="#A7ADB5" stroke-width="2" />
                    <path d="m48 99 37-30 37 30" fill="#E04F00" opacity=".9" />
                    <circle cx="121" cy="42" r="20" fill="#E04F00" />
                    <path d="m111 42 7 7 13-14" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>


            <h1 class="title">
                Reset Link Sent!
            </h1>


            <p class="description">
                We've sent a password reset link to
                the email address you provided.
            </p>


            <div class="resend-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 21 6v5c0 5.2-3.7 8.8-9 10-5.3-1.2-9-4.8-9-10V6l9-3Z" />
                    <path d="m8 12 2.5 2.5L16 9" />
                </svg>
                <span>
                    Didn't receive the email? Check your spam folder
                    or <a href="{% url 'forgot_password' %}" class="link">try resending the link.</a>
                </span>
            </div>


            <a
                href="{% url 'forgot_password' %}"
                class="button"
            >
                <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 11 18-8-5 18-5-7-8-3Z" />
                    <path d="m11 14 4-5" fill="none" stroke="#FFF" stroke-width="1.5" />
                </svg>
                Send Resent Link
            </a>

            <a href="{% url 'login' %}" class="back-link">Back to Login</a>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>


</body>

</html>
