<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<title>THE BAG CODE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0 !important;
    padding: 0 !important;
    font-family:
        "DM Sans",
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: transparent !important;
    color: #111827;
    overflow-x: hidden;
}


/* =====================================================
   MAIN
===================================================== */

.order-wrapper {
    width: 100% !important;
    max-width: none !important;
    min-height: 100vh;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    display: flex;
    align-items: center;
    justify-content: center;
}

.order-card {
    width: 100% !important;
    max-width: 680px !important;
    margin: 0 auto !important;
    background: #ffffff;
    border-radius: 10px !important;
    padding: 16px 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.10) !important;
}


/* =====================================================
   HEADER
===================================================== */

.order-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.order-header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.close-btn {
    width: 22px;
    height: 22px;

    border: none;
    background: transparent;

    border-radius: 50%;

    font-size: 18px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #111827;

    transition: .2s ease;
}

.close-btn:hover {
    background: #f5f5f5;
}


/* =====================================================
   PRODUCT
===================================================== */

.product {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding-bottom: 16px;
}

.product-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.product-media {
    width: 62px;
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 12px;

    background: #f5f5f5;
}

.product-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
    object-position: center;

    background: #f5f5f5;
}

.product-info h2 {
    margin: 0 0 10px;

    font-size: 18px;
    font-weight: 700;
}

.product-info p {
    margin: 0;

    font-size: 12px;

    color: #4b5563;
}

.product-price {
    text-align: right;
}

.product-price span {
    font-size: 18px;
    font-weight: 700;
    font-family: "DM Sans", sans-serif;
}


/* =====================================================
   COUNTRY / CURRENCY BOX
===================================================== */

.currency-box {
    margin: 12px 0 16px;

    padding: 12px;

    border: 1px solid #e1e5ea;

    border-radius: 12px;

    background: #fafbfc;
}

.currency-label {
    display: block;

    margin-bottom: 11px;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: .2px;

    color: #374151;
}


/* CUSTOM SELECT */

.currency-select {
    position: relative;

    width: 100%;
}


/* SELECTED */

.currency-selected {
    width: 100%;
    min-height: 48px;

    padding: 0 12px;

    border: 1px solid #d4d9df;

    border-radius: 10px;

    background: #ffffff;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: space-between;

    transition: .2s ease;
}

.currency-selected:hover {
    border-color: #b9c0c8;
}

.currency-selected.active {
    border-color: #d4d9df;

    box-shadow: none;
}


/* SELECTED LEFT */

.selected-left {
    display: flex;
    align-items: center;

    gap: 8px;
}

.selected-flag {
    font-size: 21px;

    line-height: 1;
}

.selected-country {
    display: flex;
    align-items: center;

    gap: 7px;

    font-size: 13px;
    font-weight: 700;
    font-family: "DM Sans", sans-serif;

    color: #111827;
}

.selected-currency {
    color: #4b5563;

    font-weight: 600;
    font-family: "DM Sans", sans-serif;
}


/* ARROW */

.currency-arrow {
    width: 10px;
    height: 10px;

    border-right: 2px solid #111827;
    border-bottom: 2px solid #111827;

    transform: rotate(45deg);

    margin-right: 5px;
    margin-top: -5px;

    transition: .2s ease;
}

.currency-selected.active .currency-arrow {
    transform: rotate(225deg);

    margin-top: 5px;
}


/* DROPDOWN */

.currency-dropdown {
    position: absolute;

    left: 0;
    right: 0;

    top: calc(100% + 8px);

    background: #ffffff;

    border: 1px solid #e5e7eb;

    border-radius: 10px;

    box-shadow:
        0 12px 28px rgba(0,0,0,.08);

    z-index: 1000;

    overflow: hidden;

    display: none;
}

.currency-dropdown.show {
    display: block;
}


/* SEARCH */

.currency-search {
    padding: 10px 12px;

    border-bottom: 1px solid #eeeeee;

    background: #fff;
}

.currency-search input {
    width: 100%;

    height: 34px;

    padding: 0 12px;

    border: 1px solid #d4d9df;

    border-radius: 9px;

    outline: none;

    font-size: 14px;
}

.currency-search input:focus {
    border-color: #d4d9df;
    box-shadow: none;
}


/* OPTIONS */

.currency-options {
    max-height: 230px;

    overflow-y: auto;

    padding: 5px;
}

.currency-option {
    width: 100%;

    border: 0;

    background: transparent;

    padding: 8px 10px;

    border-radius: 9px;

    cursor: pointer;

    display: flex;
    align-items: center;

    gap: 12px;

    text-align: left;

    transition: .15s ease;
}

.currency-option:hover {
    background: #f5f6f7;
}

.currency-option.selected {
    background: #fff3ed;
}

.option-flag {
    width: 30px;

    font-size: 13px;

    text-align: center;
}

.option-info {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 2px;
}

.option-country {
    font-size: 14px;
    font-weight: 700;
    font-family: "DM Sans", sans-serif;

    color: #111827;
}

.option-currency {
    font-size: 12px;
    font-family: "DM Sans", sans-serif;

    color: #6b7280;
}

.option-check {
    color: #E04F00;

    font-size: 13px;

    display: none;
}

.currency-option.selected .option-check {
    display: block;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider {
    height: 1px;

    background: #e5e7eb;

    margin-bottom: 16px;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-header {
    display: flex;

    justify-content: flex-end;

    margin-bottom: 16px;

    font-size: 13px;

    font-weight: 600;

    color: #374151;
}

.summary-header span {
    display: inline-block;

    padding: 4px 8px;

    border-radius: 6px;

    background: #f3f4f6;

    color: #374151;

    font-size: 11px;
    font-weight: 700;
}

.summary-row {
    display: grid;

    grid-template-columns: 1fr 110px;

    align-items: center;

    gap: 12px;

    margin: 10px 0;

    font-size: 12px;
    font-weight: 500;
}

.summary-row strong {
    text-align: right;

    font-weight: 700;
}

.discount {
    color: #e11d2e;
}


/* =====================================================
   TOTAL
===================================================== */

.total-box {
    border-top: 1px solid #e5e7eb;

    margin-top: 14px;

    padding-top: 16px;
}

.total-row {
    display: grid;

    grid-template-columns: 1fr auto;

    gap: 12px;

    align-items: end;
}

.total-label {
    font-size: 20px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111827;
}

.total-price {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
}

.total-price strong {
    display: block;

    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.7px;
    color: #111827;
    font-family: "DM Sans", sans-serif;
}

.total-price small {
    display: block;

    margin-top: 2px;

    color: #6b7280;

    font-size: 10px;
    font-weight: 500;
    text-align: right;
}

/* =====================================================
   INDIA PAYMENT
===================================================== */


/* =====================================================
   PAYMENT OPTIONS
===================================================== */


/* =====================================================
   TERMS
===================================================== */

.terms {
    display: flex;

    align-items: flex-start;

    gap: 6px;

    margin-top: 14px;

    font-size: 11px;

    line-height: 1.5;

    color: #111827;

    cursor: pointer;
}

.terms input {
    width: 13px;
    height: 13px;

    margin-top: 2px;

    border: 1.5px solid #d1d5db;
    border-radius: 3px;
    background: #ffffff;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
}

.terms input:checked {
    background: #E04F00;
    border-color: #E04F00;
}

.terms input:checked::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 0px;
    width: 3px;
    height: 7px;
    border: solid #ffffff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.terms a {
    color: #e11d2e;
    font-weight: 700;
    text-decoration: none;
}


/* =====================================================
   BUY BUTTON
===================================================== */

.buy-btn {
    width: 100%;

    height: 42px;

    border: 0;

    border-radius: 10px;

    margin-top: 18px;

    background: #E04F00;

    color: #ffffff;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s ease;
}

.buy-btn:hover {
    background: #c84300;
}

.buy-btn:disabled {
    opacity: .5;

    cursor: not-allowed;
}


/* =====================================================
   SECURE
===================================================== */

.secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    margin-top: 10px;

    color: #5e6672;

    font-size: 12px;
    font-weight: 500;
}


/* =====================================================
   SECURITY BOX
===================================================== */

.security-box {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 16px;

    padding: 12px;

    border: 1px solid #e2e5e9;

    border-radius: 12px;

    background: #f8f9fb;
}

.security-icon {
    font-size: 28px;
}

.security-box h3 {
    margin: 0 0 5px;

    font-size: 13px;
}

.security-box p {
    margin: 0;

    color: #4b5563;

    line-height: 1.5;

    font-size: 13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

    .order-wrapper {
        max-width: 450px;
        margin: 10px auto;
        padding: 0 8px;
        align-items: flex-start;
    }

    .order-card {
        padding: 18px 14px;

        border-radius: 10px;
    }

    .order-header h1 {
        font-size: 21px;
    }

    .close-btn {
        width: 40px;
        height: 40px;

        font-size: 21px;
    }

    .product {
        align-items: flex-start;
    }

    .product-left {
        gap: 8px;
    }

    .product-image {
        width: 68px;
        height: 68px;
    }

    .product-info h2 {
        font-size: 13px;
    }

    .product-info p {
        font-size: 13px;
    }

    .product-price span {
        font-size: 13px;
    }

    .currency-box {
        padding: 16px;

        border-radius: 15px;
    }

    .currency-selected {
        min-height: 42px;

        padding: 0 14px;
    }

    .selected-country {
        font-size: 13px;
    }

    .selected-flag {
        font-size: 13px;
    }

    .summary-row {
        grid-template-columns: 1fr 125px;

        font-size: 13px;
    }

    .total-row {
        grid-template-columns: 1fr 135px;
    }

    .total-label {
        font-size: 25px;
    }

    .total-price strong {
        font-size: 24px;
    }

    .buy-btn {
        height: 42px;

        font-size: 13px;
    }

    .terms {
        font-size: 14px;
    }

    .security-box {
        padding: 15px;
    }
}
,
.currency-badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:4px 8px;
    border-radius:6px;
    background:#eef1f4;
    color:#5f6670;
    font-size:12px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
}
</style>
<link rel="stylesheet" href="/static/responsive.css">
</head>


<body>


<div class="order-wrapper">

<div class="order-card">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="order-header">

    <h1>
        Your Purchase
    </h1>

    <button
        class="close-btn"
        onclick="closeOrder()"
    >
        ×
    </button>

</div>



<!-- =====================================================
     PRODUCT
===================================================== -->

<div class="product">

    <div class="product-left">

        <div class="product-media"><img class="product-image" src="{% static 'bag.png' %}" alt="THE BAG CODE"></div>

        <div class="product-info">

            <h2>THE BAG CODE</h2>

            <p>
                Lifetime Access
            </p>

        </div>

    </div>


    <div class="product-price">

        <span id="productLocal">
            $18.00
        </span>

    </div>

</div>



<!-- =====================================================
     COUNTRY / CURRENCY
===================================================== -->

<div class="currency-box">

    <label class="currency-label">
        COUNTRY / CURRENCY
    </label>


    <div
        class="currency-select"
        id="currencySelect"
    >


        <!-- SELECTED -->

        <div
            class="currency-selected"
            id="currencySelected"
            onclick="toggleCurrency()"
        >

            <div class="selected-left">

                <span
                    class="selected-flag"
                    id="selectedFlag"
                >
                    🇮🇳
                </span>

                <div class="selected-country">

                    <span id="selectedCountry">
                        India
                    </span>

                    <span>—</span>

                    <span
                        class="selected-currency"
                        id="selectedCurrency"
                    >
                        INR (₹)
                    </span>

                </div>

            </div>


            <span class="currency-arrow"></span>

        </div>



        <!-- DROPDOWN -->

        <div
            class="currency-dropdown"
            id="currencyDropdown"
        >


            <!-- SEARCH -->

            <div class="currency-search">

                <input
                    type="text"
                    id="currencySearch"
                    placeholder="Search country or currency..."
                    oninput="searchCountries()"
                >

            </div>


            <!-- OPTIONS -->

            <div
                class="currency-options"
                id="currencyOptions"
            ></div>


        </div>

    </div>

</div>



<!-- =====================================================
     DIVIDER
===================================================== -->

<div class="divider"></div>



<!-- =====================================================
     CURRENCY HEADER
===================================================== -->

<div class="summary-header">

    <span id="currencyHeader">
        INR (₹)
    </span>

</div>



<!-- =====================================================
     SUBTOTAL
===================================================== -->

<div class="summary-row">

    <span>
        Subtotal
    </span>

    <strong id="subtotalLocal">
        $18.00
    </strong>

</div>



<!-- =====================================================
     DISCOUNT
===================================================== -->

<div class="summary-row discount">

    <span>
        Discount
    </span>

    <strong id="discountLocal">
        - $32.00
    </strong>

</div>



<!-- =====================================================
     TAX
===================================================== -->

<div class="summary-row">

    <span>
        Tax
    </span>

    <strong id="taxLocal">
        $0.82
    </strong>

</div>



<!-- =====================================================
     TOTAL
===================================================== -->

<div class="total-box">

    <div class="total-row">

        <div class="total-label">
            Total
        </div>


        <div class="total-price">

            <strong id="totalLocal">
                $18.82
            </strong>

            <small>
                incl. taxes
            </small>

        </div>

    </div>

</div>

<!-- =====================================================
     TERMS
===================================================== -->

<label class="terms">

    <input
        type="checkbox"
        id="termsCheck"
        onchange="checkTerms()"
    >

    <span>

        By completing this purchase, you agree to

        <a href="#">
            Clout Privacy & Terms
        </a>

        and

        <a href="#">
            Teachable's Privacy & Terms.
        </a>

    </span>

</label>



<!-- =====================================================
     BUY BUTTON
===================================================== -->

<button
    class="buy-btn"
    id="buyBtn"
    disabled
    onclick="startPayment()"
>

    Buy now

</button>


<div class="secure">
    <i class="fa-solid fa-lock"></i>
    <span>Secure payment powered by Razorpay</span>
</div>



</div>
</div>

let currentCountry = countries.find(c => c.code === "IN") || countries[0];
let exchangeRates = { USD: 1 };
let ratesLoaded = false;

const $ = id => document.getElementById(id);

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    })[char]);
}

function renderCountries(list = countries) {
    const container = $('currencyOptions');
    if (!container) return;
    container.innerHTML = '';

    if (!list.length) {
        container.innerHTML = '<div style="padding:16px;text-align:center;color:#6b7280;font-size:13px">No country found</div>';
        return;
    }

    list.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'currency-option' + (item.code === currentCountry.code ? ' selected' : '');
        button.innerHTML = `
            <span class="option-flag">${item.flag}</span>
            <span class="option-info">
                <span class="option-country">${escapeHtml(item.country)}</span>
                <span class="option-currency">${escapeHtml(item.name)} • ${item.currency} (${escapeHtml(item.symbol)})</span>
            </span>
            <span class="option-check">✓</span>`;
        button.addEventListener('click', () => selectCountry(item));
        container.appendChild(button);
    });
}

function toggleCurrency() {
    const dropdown = $('currencyDropdown');
    const selected = $('currencySelected');
    if (!dropdown || !selected) return;
    const open = dropdown.classList.toggle('show');
    selected.classList.toggle('active', open);
    if (open) {
        $('currencySearch').value = '';
        renderCountries();
        setTimeout(() => $('currencySearch').focus(), 20);
    }
}

function closeCurrency() {
    $('currencyDropdown')?.classList.remove('show');
    $('currencySelected')?.classList.remove('active');
}

function searchCountries() {
    const q = ($('currencySearch')?.value || '').trim().toLowerCase();
    renderCountries(countries.filter(item =>
        item.country.toLowerCase().includes(q) ||
        item.name.toLowerCase().includes(q) ||
        item.currency.toLowerCase().includes(q) ||
        item.code.toLowerCase().includes(q)
    ));
}

function selectCountry(item) {
    currentCountry = item;
    $('selectedFlag').textContent = item.flag;
    $('selectedCountry').textContent = item.country;
    $('selectedCurrency').textContent = `${item.currency} (${item.symbol})`;
    renderCountries();
    updateCheckout();
    closeCurrency();
}

function getRate(currency) {
    return currency === 'USD' ? 1 : exchangeRates[currency];
}

function formatMoney(amount, currency) {
    if (!Number.isFinite(amount)) return '—';
    try {
        return new Intl.NumberFormat(undefined, {
            style: 'currency',
            currency: currency,
            currencyDisplay: 'symbol',
            minimumFractionDigits: currency === 'JPY' || currency === 'KRW' ? 0 : 2,
            maximumFractionDigits: currency === 'JPY' || currency === 'KRW' ? 0 : 2
        }).format(amount);
    } catch {
        const symbol = countries.find(c => c.currency === currency)?.symbol || currency;
        return `${symbol}${amount.toFixed(2)}`;
    }
}

function updateBuyState(ok) {
    const btn = $('buyBtn');
    if (!btn) return;
    btn.disabled = !($('termsCheck')?.checked && ok);
}

function updateCheckout() {
    const rate = getRate(currentCountry.currency);
    $('currencyHeader').textContent = `${currentCountry.currency} (${currentCountry.symbol})`;

    if (!ratesLoaded || !Number.isFinite(rate) || rate <= 0) {
        $('productLocal').textContent = '—';
        $('subtotalLocal').textContent = '—';
        $('discountLocal').textContent = '—';
        $('taxLocal').textContent = '—';
        $('totalLocal').textContent = 'Unavailable';
        updateBuyState(false);
        return;
    }

    // Base checkout values are always USD: $18.00, -$32.00, $0.82, total $18.82.
    // Every displayed amount is converted with the same live USD -> currency rate.
    const subtotal = BASE_SUBTOTAL_USD * rate;
    const discount = BASE_DISCOUNT_USD * rate;
    const tax = BASE_TAX_USD * rate;
    const total = BASE_TOTAL_USD * rate;

    $('productLocal').textContent = formatMoney(subtotal, currentCountry.currency);
    $('subtotalLocal').textContent = formatMoney(subtotal, currentCountry.currency);
    $('discountLocal').textContent = '- ' + formatMoney(discount, currentCountry.currency);
    $('taxLocal').textContent = formatMoney(tax, currentCountry.currency);
    $('totalLocal').textContent = formatMoney(total, currentCountry.currency);
    updateBuyState(true);
}

function checkTerms() {
    const rate = getRate(currentCountry.currency);
    updateBuyState(ratesLoaded && Number.isFinite(rate) && rate > 0);
}

function getPaymentInstruments(country) {
    if (country.code === 'IN') {
        return [
            { method: 'upi' },
            { method: 'card' },
            { method: 'netbanking' },
            { method: 'wallet' }
        ];
    }

    if (country.code === 'US') {
        return [
            { method: 'card' },
            { method: 'wallet' }
        ];
    }

    return [
        { method: 'card' },
        { method: 'wallet' }
    ];
}

async function loadExchangeRates() {
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD', {
            cache: 'no-store',
            headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (data.result !== 'success' || !data.rates || typeof data.rates.USD !== 'number') {
            throw new Error('Invalid exchange-rate response');
        }

        exchangeRates = data.rates;
        exchangeRates.USD = 1;
        ratesLoaded = true;
        updateCheckout();
    } catch (error) {
        console.error('Live exchange rates unavailable:', error);
        ratesLoaded = false;
        updateCheckout();
    }
}

function startPayment() {
    const rate = getRate(currentCountry.currency);
    if (!$('termsCheck')?.checked || !ratesLoaded || !Number.isFinite(rate) || rate <= 0) return;

    const total = BASE_TOTAL_USD * rate;
    const button = $('buyBtn');
    button.disabled = true;
    button.textContent = 'Loading...';

    fetch('{% url "create_order" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken') || '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams({
            currency: currentCountry.currency,
            amount: total.toFixed(2),
            country_code: currentCountry.code
        })
    })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            if (!ok || !data.success) throw new Error(data.message || 'Could not create payment order.');

            const razorpay = new Razorpay({
                key: data.key,
                amount: data.amount,
                currency: data.currency,
                name: 'Clout',
                description: 'The AI Income Playbook',
                order_id: data.order_id,
                prefill: {
                    name: '{{ request.user.name|escapejs }}',
                    email: '{{ request.user.email|escapejs }}'
                },
                theme: {
                    color: '#E04F00'
                },
                config: {
                    display: {
                        blocks: {
                            payment_methods: {
                                name: 'Payment Methods',
                                instruments: getPaymentInstruments(currentCountry)
                            }
                        },
                        sequence: ['block.payment_methods'],
                        preferences: {
                            show_default_blocks: false
                        }
                    }
                },
                handler: payment => verifyPayment(payment),
                modal: {
                    ondismiss: resetPaymentButton
                }
            });

            razorpay.on('payment.failed', event => {
                alert(event.error?.description || 'Payment failed. Please try again.');
                resetPaymentButton();
            });
            razorpay.open();
        })
        .catch(error => {
            alert(error.message || 'Unable to start payment. Please try again.');
            resetPaymentButton();
        });
}

function getCookie(name) {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const cookie of cookies) {
        const [key, ...value] = cookie.trim().split('=');
        if (key === name) return decodeURIComponent(value.join('='));
    }
    return '';
}

function resetPaymentButton() {
    const button = $('buyBtn');
    if (button) {
        button.disabled = false;
        button.textContent = 'Buy now';
    }
}

function verifyPayment(payment) {
    const body = new URLSearchParams({
        razorpay_order_id: payment.razorpay_order_id,
        razorpay_payment_id: payment.razorpay_payment_id,
        razorpay_signature: payment.razorpay_signature
    });

    fetch('{% url "verify_payment" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken') || '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
    })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            if (!ok || !data.success) throw new Error(data.message || 'Payment verification failed.');
            window.top.location.href = data.redirect_url;
        })
        .catch(error => {
            alert(error.message || 'Payment verification failed.');
            resetPaymentButton();
        });
}

function closeOrder() {
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'closeCheckout' }, window.location.origin);
    }
}

document.addEventListener('click', event => {
    const box = $('currencySelect');
    if (box && !box.contains(event.target)) closeCurrency();
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeCurrency();
});

// India / INR is selected by default.
renderCountries();
selectCountry(currentCountry);
loadExchangeRates();
</script>
