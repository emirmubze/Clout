{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clout Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Acme&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z' stroke='%23E04F00' stroke-width='2' fill='none'/><path d='M9 12L11 14L15 10' stroke='%23E04F00' stroke-width='2' fill='none'/></svg>" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', Arial, sans-serif;
      background: linear-gradient(90deg, rgba(8, 10, 13, 0.9), rgba(30, 32, 34, 0.72)),
                  url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1600&q=80') center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    :root {
      --orange: #E04F00;
      --black: #020202;
      --dark: #0E0E0E;
      --dark-gray: #383838;
      --white: #FFFFFF;
      --peach: #FFDECC;
      --warm-white: #FFDFD8;
      --off-white: #FBF8F4;
      --warm-gray: #F0EDE6;
      --heading: 'Acme', sans-serif;
      --body: 'DM Sans', sans-serif;
    }

    .checkout-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 30px 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
      animation: popup 0.22s ease-out;
      position: relative;
      transition: all 0.2s;
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 28px;
      font-weight: 300;
      color: #1e1e1e;
      cursor: pointer;
      line-height: 1;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    .close-btn:hover {
      background: #f0f0f0;
    }

    .checkout-title {
      font-family: var(--heading);
      font-size: 26px;
      font-weight: 700;
      color: #0c0c0c;
      letter-spacing: -0.3px;
      margin-bottom: 22px;
      padding-right: 40px;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid #eaeef2;
    }

    .product-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(145deg, #fff0e7, #ffd5bd);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      font-weight: 700;
      font-size: 14px;
      color: #1c1c1c;
    }
    .product-icon .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #111;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .product-icon .clout-text {
      font-family: var(--heading);
      font-size: 20px;
      color: #E04F00;
      font-style: italic;
      letter-spacing: -0.5px;
      margin-top: 6px;
    }

    .product-info {
      flex: 1;
    }
    .product-name {
      font-weight: 600;
      font-size: 17px;
      color: #0f0f0f;
      margin-bottom: 2px;
    }
    .product-desc {
      font-size: 13px;
      color: #6b7887;
      font-weight: 450;
    }

    .product-price {
      font-weight: 700;
      font-size: 18px;
      color: #0c0c0c;
      white-space: nowrap;
    }

    .total-section {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 0 16px;
      border-bottom: 1px solid #eaeef2;
    }
    .total-label {
      font-weight: 500;
      font-size: 17px;
      color: #111;
    }
    .total-right {
      text-align: right;
    }
    .total-price {
      display: block;
      font-weight: 700;
      font-size: 18px;
      color: #0b0b0b;
    }
    .tax-text {
      font-size: 11px;
      color: #7d8895;
    }

    .terms-section {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 20px 0 22px;
    }

    .terms-checkbox {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      appearance: none;
      -webkit-appearance: none;
      background: #fff;
      border: 1px solid #9aa3b0;
      cursor: pointer;
      position: relative;
      margin-top: 1px;
      transition: 0.12s;
    }
    .terms-checkbox:checked {
      background: #E04F00;
      border-color: #E04F00;
    }
    .terms-checkbox:checked::after {
      content: "✓";
      position: absolute;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      left: 2px;
      top: -1px;
    }
    .terms-checkbox:focus-visible {
      outline: 2px solid #E04F00;
      outline-offset: 2px;
    }

    .terms-text {
      margin-top: -3px;
      margin-left: -2px;
      font-size: 13px;
      line-height: 1.5;
      color: #1d1f24;
    }
    .terms-text a {
      color: #E04F00;
      text-decoration: none;
      font-weight: 500;
    }
    .terms-text a:hover {
      text-decoration: underline;
    }

    .payment-methods {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 8px 0 18px;
    }
    .payment-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px 10px;
      color: #1f2937;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .payment-option.active {
      border-color: #E04F00;
      background: #fff5f0;
      box-shadow: 0 0 0 2px rgba(224, 79, 0, 0.08);
    }
    .payment-option i {
      color: #E04F00;
      font-size: 15px;
      width: 18px;
      text-align: center;
    }

    .buy-button {
      width: 100%;
      height: 54px;
      border: none;
      background: var(--orange);
      color: #fff;
      border-radius: 5px;
      font-family: var(--body);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(224, 79, 0, 0.2);
      letter-spacing: 0.2px;
    }
    .buy-button:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 24px rgba(224, 79, 0, 0.3);
    }
    .buy-button:active {
      transform: scale(0.98);
    }
    .lock-icon {
      font-size: 15px;
    }

    .payment-powered {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      color: #8f99a8;
      font-size: 13px;
      font-weight: 450;
    }
    .small-lock {
      font-size: 11px;
    }

    .security-card {
      margin-top: 20px;
      border: 1px solid #e2e6ec;
      border-radius: 16px;
      padding: 14px 18px 14px 14px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: #fcfcfd;
    }
    .security-icon {
      width: 48px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .security-icon svg {
      width: 44px;
      height: 44px;
      stroke: #0f0f0f;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .security-content h3 {
      font-size: 16px;
      font-weight: 600;
      color: #0f0f0f;
      margin-bottom: 2px;
      letter-spacing: -0.2px;
    }
    .security-content p {
      font-size: 13px;
      line-height: 1.4;
      color: #68717d;
    }

    @media (max-width: 500px) {
      .checkout-card {
        padding: 24px 18px 26px;
        border-radius: 20px;
      }
      .checkout-title {
        font-size: 22px;
        margin-bottom: 18px;
      }
      .product-name {
        font-size: 15px;
      }
      .product-desc {
        font-size: 12px;
      }
      .product-price {
        font-size: 16px;
      }
      .total-price {
        font-size: 16px;
      }
      .buy-button {
        height: 48px;
        font-size: 17px;
        border-radius: 12px;
      }
      .security-card {
        padding: 12px 14px;
        gap: 12px;
      }
      .security-icon svg {
        width: 28px;
        height: 28px;
      }
      .security-content h3 {
        font-size: 14px;
      }
      .security-content p {
        font-size: 12px;
      }
      .terms-text {
        font-size: 12px;
      }
      .close-btn {
        top: 10px;
        right: 12px;
        font-size: 26px;
      }
    }

    @media (max-width: 400px) {
      .checkout-card {
        padding: 18px 14px 20px;
      }
      .product-row {
        gap: 12px;
      }
      .product-icon {
        width: 50px;
        height: 50px;
      }
      .product-icon .clout-text {
        font-size: 16px;
      }
      .product-name {
        font-size: 14px;
      }
      .product-desc {
        font-size: 11px;
      }
      .product-price {
        font-size: 15px;
      }
      .total-price {
        font-size: 15px;
      }
      .terms-checkbox {
        width: 15px;
        height: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="checkout-card" id="checkoutModal">
    <button class="close-btn" id="closeBtn" aria-label="Close">×</button>

    <h1 class="checkout-title">Order summary</h1>

    <div class="product-row">
      <div class="product-icon">
        <span class="badge">PRO</span>
        <span class="clout-text">clout</span>
      </div>
      <div class="product-info">
        <div class="product-name">{{ product_name }}</div>
        <div class="product-desc">Lifetime Access • Premium</div>
      </div>
      <div class="product-price">${{ total }}</div>
    </div>

    <div class="total-section">
      <span class="total-label">Total</span>
      <div class="total-right">
        <span class="total-price">${{ total }}</span>
        <span class="tax-text">incl. taxes</span>
      </div>
    </div>

    <div class="terms-section">
      <input type="checkbox" id="termsCheck" class="terms-checkbox" />
      <label for="termsCheck" class="terms-text">
        By completing this purchase, you agree to Clout
        <a href="#">Privacy &amp; Terms</a>, and Teachable's
        <a href="#">Privacy &amp; Terms</a>.
      </label>
    </div>

    <div class="payment-methods" aria-label="Payment methods">
      <div class="payment-option active" data-method="card" role="button" tabindex="0">
        <i class="fas fa-credit-card"></i>
        <span>Card</span>
      </div>
      <div class="payment-option" data-method="upi" role="button" tabindex="0">
        <i class="fas fa-mobile-alt"></i>
        <span>UPI</span>
      </div>
      <div class="payment-option" data-method="netbanking" role="button" tabindex="0">
        <i class="fas fa-university"></i>
        <span>Netbanking</span>
      </div>
      <div class="payment-option" data-method="wallet" role="button" tabindex="0">
        <i class="fas fa-wallet"></i>
        <span>Wallet</span>
      </div>
    </div>

    <button class="buy-button" id="pay-button" type="button">
      <span>Pay now</span>
    </button>

    <div class="payment-powered">
      <i class="fas fa-lock small-lock"></i>
      <span>Secure payment powered by Razorpay</span>
    </div>

    <div class="security-card">
      <div class="security-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" />
          <path d="M9 12L11 14L15 10" />
        </svg>
      </div>
      <div class="security-content">
        <h3>100% Secure Payment</h3>
        <p>Your payment information is encrypted and safe with Razorpay.</p>
      </div>
    </div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function() {
      const modal = document.getElementById('checkoutModal');
      const closeBtn = document.getElementById('closeBtn');
      const payButton = document.getElementById('pay-button');
      const termsCheck = document.getElementById('termsCheck');
      const paymentOptions = document.querySelectorAll('.payment-option');
      let selectedMethod = 'card';

      function closeCheckout() {
        modal.style.display = 'none';
      }

      paymentOptions.forEach(option => {
        option.addEventListener('click', () => {
          paymentOptions.forEach(item => item.classList.remove('active'));
          option.classList.add('active');
          selectedMethod = option.dataset.method;
        });
      });

      closeBtn.addEventListener('click', closeCheckout);

      payButton.addEventListener('click', async () => {
        if (!termsCheck.checked) {
          alert('Please agree to the Privacy & Terms before continuing.');
          return;
        }

        payButton.disabled = true;
        payButton.innerText = 'Processing...';

        try {
          const r = await fetch("{% url 'create_order' %}", {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
          });

          const data = await r.json();
          if (!r.ok || !data.success) {
            throw new Error(data.message || 'Could not create order.');
          }

          const options = {
            key: data.key,
            amount: data.amount,
            currency: data.currency,
            name: 'Clout',
            description: "{{ product_name|escapejs }}",
            order_id: data.order_id,
            method: {
              card: selectedMethod === 'card',
              upi: selectedMethod === 'upi',
              netbanking: selectedMethod === 'netbanking',
              wallet: selectedMethod === 'wallet'
            },
            handler: async function(response) {
              const body = new URLSearchParams();
              body.append('razorpay_payment_id', response.razorpay_payment_id);
              body.append('razorpay_order_id', response.razorpay_order_id);
              body.append('razorpay_signature', response.razorpay_signature);

              const vr = await fetch("{% url 'verify_payment' %}", {
                method: 'POST',
                headers: {
                  'X-CSRFToken': '{{ csrf_token }}',
                  'Content-Type': 'application/x-www-form-urlencoded'
                },
                body
              });

              const result = await vr.json();
              if (result.success) {
                window.location.href = "{% url 'payment_success' %}";
              } else {
                throw new Error(result.message || 'Payment verification failed.');
              }
            },
            modal: {
              ondismiss: function() {
                payButton.disabled = false;
                payButton.innerText = 'Buy';
              }
            },
            theme: { color: '#E04F00' }
          };

          const rzp = new Razorpay(options);
          rzp.on('payment.failed', function() {
            payButton.disabled = false;
            payButton.innerText = 'Buy';
            alert('Payment failed. Please try again.');
          });
          rzp.open();
        } catch (e) {
          console.error(e);
          alert(e.message || 'Unable to start payment.');
          payButton.disabled = false;
          payButton.innerText = 'Buy';
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeCheckout();
        }
      });

      document.body.addEventListener('click', function(e) {
        if (e.target === document.body || e.target.closest('.checkout-card') === null) {
          const card = document.querySelector('.checkout-card');
          if (card && !card.contains(e.target)) {
            closeCheckout();
          }
        }
      });
    })();
  </script>
</body>
</html>
