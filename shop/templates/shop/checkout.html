<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<title>THE BAG CODE — Secure Checkout</title>

<style>
:root {
    --brand: #E04F00;
    --brand-hover: #c84300;
    --brand-light: #fff3ec;
    --brand-glow: rgba(224, 79, 0, 0.22);
    --dark: #0f172a;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --bg-card: #ffffff;
    --border-subtle: #e2e8f0;
    --border-hover: #cbd5e1;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-card: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.05);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    font-family: "Plus Jakarta Sans", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent !important;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

.order-wrapper {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.order-card {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle);
    padding: 24px 24px 20px;
    box-shadow: var(--shadow-card);
    position: relative;
    animation: cardAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =====================================================
   HEADER
===================================================== */
.order-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 18px;
}

.order-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.secure-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--brand-light);
    color: var(--brand);
    font-size: 13px;
}

.order-header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--dark);
}

.close-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border-subtle);
    background: #f8fafc;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all 0.2s ease;
}

.close-btn:hover {
    background: #f1f5f9;
    color: var(--dark);
    transform: rotate(90deg);
}

/* =====================================================
   PRODUCT
===================================================== */
.product {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px;
    border-radius: var(--radius-md);
    background: #f8fafc;
    border: 1px solid var(--border-subtle);
    margin-bottom: 16px;
}

.product-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.product-media {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: #ffffff;
    border: 1px solid var(--border-subtle);
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}

.product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info h2 {
    margin: 0 0 3px;
    font-size: 15px;
    font-weight: 800;
    color: var(--dark);
    letter-spacing: -0.2px;
}

.product-info p {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--brand);
    display: flex;
    align-items: center;
    gap: 5px;
}

.product-price {
    text-align: right;
}

.product-price span {
    font-size: 17px;
    font-weight: 800;
    color: var(--dark);
    font-family: "DM Sans", sans-serif;
}

/* =====================================================
   COUNTRY / CURRENCY BOX
===================================================== */
.currency-box {
    margin-bottom: 16px;
    padding: 14px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: #ffffff;
}

.currency-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-secondary);
}

.currency-select {
    position: relative;
    width: 100%;
}

.currency-selected {
    width: 100%;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    background: #f8fafc;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s ease;
}

.currency-selected:hover {
    border-color: var(--brand);
    background: #ffffff;
}

.currency-selected.active {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
    background: #ffffff;
}

.selected-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
}

.selected-flag {
    font-size: 20px;
    line-height: 1;
    display: inline-block;
}

.selected-country {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    white-space: nowrap;
}

.selected-currency {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
}

.currency-arrow {
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--text-secondary);
    border-bottom: 2px solid var(--text-secondary);
    transform: rotate(45deg);
    margin-right: 2px;
    margin-top: -3px;
    transition: transform 0.2s ease;
}

.currency-selected.active .currency-arrow {
    transform: rotate(225deg);
    margin-top: 3px;
}

.currency-dropdown {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    background: #ffffff;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    box-shadow: 0 14px 35px -5px rgba(15, 23, 42, 0.15);
    z-index: 1000;
    overflow: hidden;
    display: none;
    animation: dropdownOpen 0.18s ease-out;
}

@keyframes dropdownOpen {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

.currency-dropdown.show {
    display: block;
}

.currency-search {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-subtle);
    background: #f8fafc;
}

.currency-search input {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    outline: none;
    font-family: inherit;
    font-size: 13px;
    background: #ffffff;
    color: var(--dark);
    transition: border-color 0.15s ease;
}

.currency-search input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px var(--brand-glow);
}

.currency-options {
    max-height: 220px;
    overflow-y: auto;
    padding: 6px;
}

.currency-options::-webkit-scrollbar {
    width: 5px;
}
.currency-options::-webkit-scrollbar-track {
    background: #f1f5f9;
}
.currency-options::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
}

.currency-option {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    transition: background 0.15s ease;
}

.currency-option:hover {
    background: #f1f5f9;
}

.currency-option.selected {
    background: var(--brand-light);
}

.option-flag {
    width: 26px;
    font-size: 18px;
    text-align: center;
    flex-shrink: 0;
}

.option-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow: hidden;
}

.option-country {
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
}

.option-currency {
    font-size: 11px;
    color: var(--text-secondary);
}

.option-check {
    color: var(--brand);
    font-size: 13px;
    font-weight: 800;
    display: none;
}

.currency-option.selected .option-check {
    display: block;
}

/* =====================================================
   SUMMARY
===================================================== */
.summary-container {
    background: #f8fafc;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px 16px 12px;
    margin-bottom: 16px;
}

.summary-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border-subtle);
}

.summary-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
}

.summary-header span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #ffffff;
    border: 1px solid var(--border-subtle);
    color: var(--brand);
    font-size: 11px;
    font-weight: 700;
}

.summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
}

.summary-row strong {
    color: var(--dark);
    font-weight: 700;
    font-family: "DM Sans", sans-serif;
}

.summary-row.discount {
    color: #16a34a;
}

.summary-row.discount strong {
    color: #16a34a;
}

.total-box {
    border-top: 1px solid var(--border-subtle);
    margin-top: 10px;
    padding-top: 10px;
}

.total-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
}

.total-label {
    font-size: 16px;
    font-weight: 800;
    color: var(--dark);
    letter-spacing: -0.3px;
}

.total-price {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.total-price strong {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--dark);
    font-family: "DM Sans", sans-serif;
}

.total-price small {
    margin-top: 2px;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
}

/* =====================================================
   TERMS
===================================================== */
.terms {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
}

.terms input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 17px;
    height: 17px;
    border: 1.5px solid var(--border-hover);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    background: #ffffff;
    display: grid;
    place-content: center;
    transition: all 0.15s ease;
}

.terms input[type="checkbox"]:checked {
    background: var(--brand);
    border-color: var(--brand);
}

.terms input[type="checkbox"]:checked::before {
    content: "\f00c";
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 10px;
    color: #ffffff;
}

.terms span {
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--text-secondary);
}

.terms a {
    color: var(--brand);
    text-decoration: none;
    font-weight: 600;
}

.terms a:hover {
    text-decoration: underline;
}

/* =====================================================
   BUY BUTTON
===================================================== */
.buy-btn {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #FF6611 0%, #E04F00 100%);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px var(--brand-glow);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.buy-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(224, 79, 0, 0.35);
}

.buy-btn:active:not(:disabled) {
    transform: translateY(0);
}

.buy-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
    background: #94a3b8;
}

.secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
}

.secure i {
    color: #16a34a;
    font-size: 12px;
}

@media (max-width: 480px) {
    .order-card {
        padding: 18px 16px 16px;
    }
    .order-header h1 {
        font-size: 16px;
    }
    .product-info h2 {
        font-size: 14px;
    }
    .product-price span {
        font-size: 15px;
    }
    .total-price strong {
        font-size: 20px;
    }
}
</style>
<link rel="stylesheet" href="/static/responsive.css">
</head>

<body>

<div class="order-wrapper">
    <div class="order-card">

        <!-- =====================================================
             HEADER
        ===================================================== -->
        <div class="order-header">
            <div class="order-header-left">
                <div class="secure-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Your Purchase</h1>
            </div>

            <button
                class="close-btn"
                onclick="closeOrder()"
                aria-label="Close checkout"
                type="button"
            >
                &times;
            </button>
        </div>

        <!-- =====================================================
             PRODUCT
        ===================================================== -->
        <div class="product">
            <div class="product-left">
                <div class="product-media">
                    <img class="product-image" src="{% static 'bag.png' %}" alt="THE BAG CODE">
                </div>

                <div class="product-info">
                    <h2>THE BAG CODE</h2>
                    <p><i class="fa-solid fa-bolt"></i> Lifetime Access</p>
                </div>
            </div>

            <div class="product-price">
                <span id="productLocal">$18.00</span>
            </div>
        </div>

        <!-- =====================================================
             COUNTRY / CURRENCY
        ===================================================== -->
        <div class="currency-box">
            <label class="currency-label">
                <span>COUNTRY / CURRENCY</span>
                <span style="font-size:10px;font-weight:600;color:var(--text-muted)">Live Rates</span>
            </label>

            <div class="currency-select" id="currencySelect">
                <!-- SELECTED -->
                <div
                    class="currency-selected"
                    id="currencySelected"
                    onclick="toggleCurrency()"
                    role="button"
                    tabindex="0"
                >
                    <div class="selected-left">
                        <span class="selected-flag" id="selectedFlag">🇮🇳</span>
                        <div class="selected-country">
                            <span id="selectedCountry">India</span>
                            <span>—</span>
                            <span class="selected-currency" id="selectedCurrency">INR (₹)</span>
                        </div>
                    </div>

                    <span class="currency-arrow"></span>
                </div>

                <!-- DROPDOWN -->
                <div class="currency-dropdown" id="currencyDropdown">
                    <div class="currency-search">
                        <input
                            type="text"
                            id="currencySearch"
                            placeholder="Search country or currency..."
                            oninput="searchCountries()"
                            autocomplete="off"
                        >
                    </div>

                    <div class="currency-options" id="currencyOptions"></div>
                </div>
            </div>
        </div>

        <!-- =====================================================
             SUMMARY
        ===================================================== -->
        <div class="summary-container">
            <div class="summary-header">
                <span class="summary-title">Summary</span>
                <span id="currencyHeader">INR (₹)</span>
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotalLocal">$18.00</strong>
            </div>

            <div class="summary-row discount">
                <span>Discount</span>
                <strong id="discountLocal">- $32.00</strong>
            </div>

            <div class="summary-row">
                <span>Tax</span>
                <strong id="taxLocal">$0.82</strong>
            </div>

            <div class="total-box">
                <div class="total-row">
                    <div class="total-label">Total</div>
                    <div class="total-price">
                        <strong id="totalLocal">$18.82</strong>
                        <small>incl. taxes</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- =====================================================
             TERMS
        ===================================================== -->
        <label class="terms" for="termsCheck">
            <input
                type="checkbox"
                id="termsCheck"
                onchange="checkTerms()"
            >
            <span>
                By completing this purchase, you agree to
                <a href="#">Clout Privacy &amp; Terms</a>
                and
                <a href="#">Teachable's Privacy &amp; Terms</a>.
            </span>
        </label>

        <!-- =====================================================
             BUY BUTTON
        ===================================================== -->
        <button
            class="buy-btn"
            id="buyBtn"
            disabled
            onclick="startPayment()"
            type="button"
        >
            <i class="fa-solid fa-lock" style="font-size:13px"></i>
            <span>Buy now</span>
        </button>

        <div class="secure">
            <i class="fa-solid fa-shield-check"></i>
            <span>Secure payment powered by Razorpay</span>
        </div>

    </div>
</div>

<script>
const BASE_SUBTOTAL_USD = 18.00;

const $ = id => document.getElementById(id);

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    })[char]);
}

function renderCountries(list = countries) {
    const container = $('currencyOptions');
    if (!container) return;
    container.innerHTML = '';

    if (!list.length) {
        container.innerHTML = '<div style="padding:16px;text-align:center;color:#64748b;font-size:13px">No country found</div>';
        return;
    }

    list.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'currency-option' + (item.code === currentCountry.code ? ' selected' : '');
        button.innerHTML = `
            <span class="option-flag">${item.flag}</span>
            <span class="option-info">
                <span class="option-country">${escapeHtml(item.country)}</span>
                <span class="option-currency">${escapeHtml(item.name)} • ${item.currency} (${escapeHtml(item.symbol)})</span>
            </span>
            <span class="option-check"><i class="fa-solid fa-check"></i></span>`;
        button.addEventListener('click', () => selectCountry(item));
        container.appendChild(button);
    });
}

function toggleCurrency() {
    const dropdown = $('currencyDropdown');
    const selected = $('currencySelected');
    if (!dropdown || !selected) return;
    const open = dropdown.classList.toggle('show');
    selected.classList.toggle('active', open);
    if (open) {
        $('currencySearch').value = '';
        renderCountries();
        setTimeout(() => $('currencySearch').focus(), 20);
    }
}

function closeCurrency() {
    $('currencyDropdown')?.classList.remove('show');
    $('currencySelected')?.classList.remove('active');
}

function searchCountries() {
    const q = ($('currencySearch')?.value || '').trim().toLowerCase();
    renderCountries(countries.filter(item =>
        item.country.toLowerCase().includes(q) ||
        item.name.toLowerCase().includes(q) ||
        item.currency.toLowerCase().includes(q) ||
        item.code.toLowerCase().includes(q)
    ));
}

function selectCountry(item) {
    currentCountry = item;
    $('selectedFlag').textContent = item.flag;
    $('selectedCountry').textContent = item.country;
    $('selectedCurrency').textContent = `${item.currency} (${item.symbol})`;
    renderCountries();
    updateCheckout();
    closeCurrency();
}

function getRate(currency) {
    return currency === 'USD' ? 1 : (exchangeRates[currency] || FALLBACK_RATES[currency] || null);
}

function formatMoney(amount, currency) {
    if (!Number.isFinite(amount)) return '—';
    const isZeroDecimal = ZERO_DECIMAL_CURRENCIES.has(currency);
    try {
        return new Intl.NumberFormat(undefined, {
            style: 'currency',
            currency: currency,
            currencyDisplay: 'narrowSymbol',
            minimumFractionDigits: isZeroDecimal ? 0 : 2,
            maximumFractionDigits: isZeroDecimal ? 0 : 2
        }).format(amount);
    } catch {
        const symbol = countries.find(c => c.currency === currency)?.symbol || currency;
        return isZeroDecimal ? `${symbol}${Math.round(amount)}` : `${symbol}${amount.toFixed(2)}`;
    }
}

function updateBuyState(ok) {
    const btn = $('buyBtn');
    if (!btn) return;
    btn.disabled = !($('termsCheck')?.checked && ok);
}

function updateCheckout() {
    const rate = getRate(currentCountry.currency);
    $('currencyHeader').textContent = `${currentCountry.currency} (${currentCountry.symbol})`;

    if (!ratesLoaded || !Number.isFinite(rate) || rate <= 0) {
        $('productLocal').textContent = '—';
        $('subtotalLocal').textContent = '—';
        $('discountLocal').textContent = '—';
        $('taxLocal').textContent = '—';
        $('totalLocal').textContent = 'Unavailable';
        updateBuyState(false);
        return;
    }

    // Base checkout values are always USD: $18.00, -$32.00, $0.82, total $18.82.
    // Every displayed amount is converted with the live USD -> currency rate.
    const subtotal = BASE_SUBTOTAL_USD * rate;
    const discount = BASE_DISCOUNT_USD * rate;
    const tax = BASE_TAX_USD * rate;
    const total = BASE_TOTAL_USD * rate;

    $('productLocal').textContent = formatMoney(subtotal, currentCountry.currency);
    $('subtotalLocal').textContent = formatMoney(subtotal, currentCountry.currency);
    $('discountLocal').textContent = '- ' + formatMoney(discount, currentCountry.currency);
    $('taxLocal').textContent = formatMoney(tax, currentCountry.currency);
    $('totalLocal').textContent = formatMoney(total, currentCountry.currency);
    updateBuyState(true);
}

function checkTerms() {
    const rate = getRate(currentCountry.currency);
    updateBuyState(ratesLoaded && Number.isFinite(rate) && rate > 0);
}

function getPaymentInstruments(country) {
    if (country.currency === 'INR' || country.code === 'IN') {
        return [
            { method: 'upi' },
            { method: 'card' },
            { method: 'netbanking' },
            { method: 'wallet' }
        ];
    }

    return [
        { method: 'card' },
        { method: 'wallet' }
    ];
}

async function loadExchangeRates() {
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD', {
            cache: 'no-store',
            headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (data.result !== 'success' || !data.rates || typeof data.rates.USD !== 'number') {
            throw new Error('Invalid exchange-rate response');
        }

        exchangeRates = Object.assign({}, FALLBACK_RATES, data.rates);
        exchangeRates.USD = 1;
        ratesLoaded = true;
        updateCheckout();
    } catch (error) {
        console.warn('Live exchange rate fetch failed, using cached fallback rates:', error);
        ratesLoaded = true;
        updateCheckout();
    }
}

function startPayment() {
    const rate = getRate(currentCountry.currency);
    if (!$('termsCheck')?.checked || !ratesLoaded || !Number.isFinite(rate) || rate <= 0) return;

    const isZeroDecimal = ZERO_DECIMAL_CURRENCIES.has(currentCountry.currency);
    const total = BASE_TOTAL_USD * rate;
    const paymentAmount = isZeroDecimal ? Math.round(total).toFixed(0) : total.toFixed(2);
    const button = $('buyBtn');
    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Processing...</span>';

    fetch('{% url "create_order" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken') || '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams({
            currency: currentCountry.currency,
            amount: paymentAmount,
            country_code: currentCountry.code
        })
    })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            if (!ok || !data.success) throw new Error(data.message || 'Could not create payment order.');

            const razorpay = new Razorpay({
                key: data.key,
                amount: data.amount,
                currency: data.currency,
                name: 'Clout',
                description: 'The AI Income Playbook',
                order_id: data.order_id,
                prefill: {
                    name: '{{ request.user.name|escapejs }}',
                    email: '{{ request.user.email|escapejs }}'
                },
                theme: {
                    color: '#E04F00'
                },
                config: {
                    display: {
                        blocks: {
                            payment_methods: {
                                name: 'Payment Methods',
                                instruments: getPaymentInstruments(currentCountry)
                            }
                        },
                        sequence: ['block.payment_methods'],
                        preferences: {
                            show_default_blocks: false
                        }
                    }
                },
                handler: payment => verifyPayment(payment),
                modal: {
                    ondismiss: resetPaymentButton
                }
            });

            razorpay.on('payment.failed', event => {
                alert(event.error?.description || 'Payment failed. Please try again.');
                resetPaymentButton();
            });
            razorpay.open();
        })
        .catch(error => {
            alert(error.message || 'Unable to start payment. Please try again.');
            resetPaymentButton();
        });
}

function getCookie(name) {
    const cookies = document.cookie ? document.cookie.split(';') : [];
    for (const cookie of cookies) {
        const [key, ...value] = cookie.trim().split('=');
        if (key === name) return decodeURIComponent(value.join('='));
    }
    return '';
}

function resetPaymentButton() {
    const button = $('buyBtn');
    if (button) {
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-lock" style="font-size:13px"></i><span>Buy now</span>';
    }
}

function verifyPayment(payment) {
    const body = new URLSearchParams({
        razorpay_order_id: payment.razorpay_order_id,
        razorpay_payment_id: payment.razorpay_payment_id,
        razorpay_signature: payment.razorpay_signature
    });

    fetch('{% url "verify_payment" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken') || '{{ csrf_token }}',
            'X-Requested-With': 'XMLHttpRequest',
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body
    })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            if (!ok || !data.success) throw new Error(data.message || 'Payment verification failed.');
            window.top.location.href = data.redirect_url;
        })
        .catch(error => {
            alert(error.message || 'Payment verification failed.');
            resetPaymentButton();
        });
}

function closeOrder() {
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'closeCheckout' }, window.location.origin);
    }
}

document.addEventListener('click', event => {
    const box = $('currencySelect');
    if (box && !box.contains(event.target)) closeCurrency();
});

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeCurrency();
});

// India / INR is selected by default.
renderCountries();
selectCountry(currentCountry);
loadExchangeRates();
</script>

</body>
</html>
