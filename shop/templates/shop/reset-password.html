<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLOUT – Reset Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        :root {
            --orange: #E04F00;

            --black: #020202;

            --white: #FFFFFF;

            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;

            --body: "DM Sans", sans-serif;
        }


        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: var(--black);

            display: flex;

            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top: 1px solid var(--orange);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            display: flex;

            align-items: center;
        }


        .nav-container {
            width:
                min(1380px, calc(100% - 50px));

            margin: auto;
        }


        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: white;
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 520px;

            padding: 32px 36px 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;
        }

        .reset-illustration {
            display: flex;
            justify-content: center;
            margin: 0 auto 6px;
        }

        .reset-illustration svg {
            width: 200px;
            height: 130px;
        }


        .title {
            text-align: center;

            font-family: var(--heading);

            font-size: 28px;

            margin-bottom: 8px;
        }


        .description {
            text-align: center;

            color: #536071;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 24px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }


        .label {
            display: block;

            font-size: 14px;

            color: #536071;

            font-weight: 500;

            margin-bottom: 5px;
        }


        .input-wrap {
            position: relative;
        }


        .input {
            width: 100%;

            height: 40px;

            padding: 0 42px 0 14px;

            border: 1px solid #d8dce2;

            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }

        .input-wrap .input {
            padding-left: 48px;
        }

        .field-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            width: 18px;
            height: 18px;
            color: #8D939B;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .field-icon path,
        .field-icon rect {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        .input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(224,79,0,.06);
        }


        .eye {
            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            cursor: pointer;

            color: #a7adb5;

            font-size: 16px;
        }


        .requirements {
            margin-top: 7px;

            color: #7a8490;

            font-size: 12px;

            line-height: 1.5;
        }

        .strength-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 18px 10px;
            color: #536071;
            font-size: 12px;
        }

        .strength-row strong {
            color: #E04F00;
        }

        .strength-row[data-level="fair"] strong {
            color: #D97706;
        }

        .strength-row[data-level="good"] strong {
            color: #B45309;
        }

        .strength-row[data-level="strong"] strong {
            color: #15803D;
        }

        .strength-bars {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .strength-bars span {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: #D9DCE2;
        }

        .strength-bars span.filled {
            background: #E04F00;
        }

        .requirements-box {
            display: flex;
            gap: 10px;
            margin: 4px 0 12px;
            padding: 12px;
            border: 1px solid #F2D8CB;
            border-radius: 8px;
            background: #FFF7F2;
            color: #202020;
            font-size: 13px;
            line-height: 1.5;
        }

        .requirements-box svg {
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            color: var(--orange);
        }

        .server-error {
            margin: 0 0 12px;
            color: #B42318;
            font-size: 13px;
        }


        /* BUTTON */

        .button {
            width: 100%;

            height: 48px;

            margin-top: 12px;

            border: none;

            border-radius: 8px;

            background: var(--orange);

            font-family: var(--body);

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        .button:hover {
            background: #C2410C;
        }

        .button-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -4px;
            fill: currentColor;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            color: #536071;
            font-size: 16px;
            text-decoration: none;
            text-align: center;
        }

        .back-link:hover {
            color: var(--orange);
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top: 1px solid #e3e3e3;
        }


        .footer-container {
            width:
                min(950px, calc(100% - 48px));

            margin: auto;
        }


        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width:
                    calc(100% - 36px);
            }


            .card {
                padding:
                    26px 20px 28px;
            }


            .title {
                font-size: 24px;
            }


            .copyright {
                font-size: 13px;
            }

        }

    </style>

<link rel="stylesheet" href="/static/responsive.css">
</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'index' %}"
                class="logo"
            >
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">

            <div class="reset-illustration" aria-hidden="true">
                <svg viewBox="0 0 200 130">
                    <circle cx="100" cy="59" r="43" fill="#FFF0E8" />
                    <rect x="71" y="46" width="58" height="51" rx="10" fill="#E04F00" />
                    <path d="M82 46v-9a18 18 0 0 1 36 0v9" fill="none" stroke="#E04F00" stroke-width="8" />
                    <circle cx="100" cy="67" r="5" fill="#FFF" />
                    <path d="M100 72v11" stroke="#FFF" stroke-width="3" stroke-linecap="round" />
                    <circle cx="137" cy="86" r="18" fill="#E04F00" />
                    <path d="m128 86 6 6 11-12" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>


            <h1 class="title">
                Create New Password
            </h1>


            <p class="description">
                Enter your new password below. Make sure it's
                strong and something you don't use elsewhere.
            </p>


            <form
                id="resetForm"
                method="POST"
                action=""
            >
                {% csrf_token %}


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label
                        class="label"
                        for="password1"
                    >
                        New Password
                    </label>


                    <div class="input-wrap">

                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" />
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                        </svg>

                        <input
                            class="input"
                            type="password"
                            id="password1"
                            name="password1"
                            placeholder="Enter your new password"
                            required
                            minlength="8"
                        >


                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('password1', this)"
                        >
                            👁
                        </button>

                    </div>


                    <div class="strength-row">
                        <span>Password strength:</span>
                        <strong class="strength-label">Weak</strong>
                        <div class="strength-bars" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label
                        class="label"
                        for="password2"
                    >
                        Confirm New Password
                    </label>


                    <div class="input-wrap">

                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" />
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                        </svg>

                        <input
                            class="input"
                            type="password"
                            id="password2"
                            name="password2"
                            placeholder="Confirm your new password"
                            required
                        >


                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('password2', this)"
                        >
                            👁
                        </button>

                    </div>

                    <div class="strength-row">
                        <span>Password strength:</span>
                        <strong class="strength-label">Weak</strong>
                        <div class="strength-bars" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>

                </div>

                {% if password_error %}
                    <div class="server-error" role="alert">
                        {{ password_error }}
                    </div>
                {% endif %}


                <button
                    class="button"
                    type="submit"
                >
                    <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
                        <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" />
                    </svg>
                    Reset Password
                </button>

                <a href="{% url 'login' %}" class="back-link">Back to Login</a>


            </form>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>


    <script>

        function togglePassword(
            id,
            button
        ) {

            const input =
                document.getElementById(id);


            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";

            }

        }

        function updateStrength(input, strengthRow) {
            const password = input.value;
            const checks = [
                password.length >= 8,
                /[a-z]/.test(password),
                /[A-Z]/.test(password),
                /\d/.test(password),
                /[^A-Za-z0-9]/.test(password),
            ];
            const score = checks.filter(Boolean).length;
            const level = score >= 5 ? "strong" : score >= 4 ? "good" : score >= 2 ? "fair" : "weak";
            const labels = { weak: "Weak", fair: "Fair", good: "Good", strong: "Strong" };
            const label = strengthRow.querySelector(".strength-label");
            const bars = strengthRow.querySelectorAll(".strength-bars span");

            strengthRow.dataset.level = level;
            label.textContent = labels[level];
            bars.forEach(function (bar, index) {
                bar.classList.toggle("filled", index < Math.max(1, Math.ceil(score * 4 / 5)));
            });
        }

        document.querySelectorAll(".strength-row").forEach(function (strengthRow, index) {
            const input = document.getElementById(index === 0 ? "password1" : "password2");
            input.addEventListener("input", function () {
                updateStrength(input, strengthRow);
            });
            updateStrength(input, strengthRow);
        });


        document
            .getElementById("resetForm")
            .addEventListener(
                "submit",
                function(e) {

                    const password =
                        document.getElementById(
                            "password1"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "password2"
                        ).value;


                    if (
                        password !==
                        confirmPassword
                    ) {

                        e.preventDefault();

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    if (password.length < 8) {

                        e.preventDefault();

                        alert(
                            "Password must be at least 8 characters."
                        );

                    }

                }
            );

    </script>

</body>

</html>
