<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLOUT – Reset Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        :root {
            --orange: #E04F00;

            --black: #020202;

            --white: #FFFFFF;

            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;

            --body: "DM Sans", sans-serif;
        }


        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: var(--black);

            display: flex;

            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top: 1px solid var(--orange);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            display: flex;

            align-items: center;
        }


        .nav-container {
            width:
                min(1380px, calc(100% - 50px));

            margin: auto;
        }


        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: white;
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 400px;

            padding: 32px 36px 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;
        }


        .title {
            text-align: center;

            font-family: var(--heading);

            font-size: 28px;

            margin-bottom: 10px;
        }


        .description {
            text-align: center;

            color: #536071;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 28px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }


        .label {
            display: block;

            font-size: 14px;

            color: #536071;

            font-weight: 500;

            margin-bottom: 5px;
        }


        .input-wrap {
            position: relative;
        }


        .input {
            width: 100%;

            height: 40px;

            padding: 0 42px 0 14px;

            border: 1px solid #d8dce2;

            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }


        .input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(224,79,0,.06);
        }


        .eye {
            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            cursor: pointer;

            color: #a7adb5;

            font-size: 16px;
        }


        .requirements {
            margin-top: 7px;

            color: #7a8490;

            font-size: 12px;

            line-height: 1.5;
        }


        /* BUTTON */

        .button {
            width: 100%;

            height: 48px;

            margin-top: 12px;

            border: none;

            border-radius: 8px;

            background: var(--orange);

            font-family: var(--body);

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        .button:hover {
            background: #d34800;
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top: 1px solid #e3e3e3;
        }


        .footer-container {
            width:
                min(950px, calc(100% - 48px));

            margin: auto;
        }


        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width:
                    calc(100% - 36px);
            }


            .card {
                padding:
                    26px 20px 28px;
            }


            .title {
                font-size: 24px;
            }


            .copyright {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'index' %}"
                class="logo"
            >
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">


            <h1 class="title">
                Reset Password
            </h1>


            <p class="description">
                Create a new password for your
                CLOUT account.
            </p>


            <form
                id="resetForm"
                method="POST"
                action=""
            >
                {% csrf_token %}


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label
                        class="label"
                        for="password1"
                    >
                        New Password
                    </label>


                    <div class="input-wrap">

                        <input
                            class="input"
                            type="password"
                            id="password1"
                            name="password1"
                            placeholder="Enter new password"
                            required
                            minlength="8"
                        >


                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('password1', this)"
                        >
                            👁
                        </button>

                    </div>


                    <div class="requirements">
                        Password must be at least 8 characters.
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label
                        class="label"
                        for="password2"
                    >
                        Confirm Password
                    </label>


                    <div class="input-wrap">

                        <input
                            class="input"
                            type="password"
                            id="password2"
                            name="password2"
                            placeholder="Confirm new password"
                            required
                        >


                        <button
                            class="eye"
                            type="button"
                            onclick="togglePassword('password2', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    class="button"
                    type="submit"
                >
                    Reset Password
                </button>


            </form>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>


    <script>

        function togglePassword(
            id,
            button
        ) {

            const input =
                document.getElementById(id);


            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";

            }

        }


        document
            .getElementById("resetForm")
            .addEventListener(
                "submit",
                function(e) {

                    const password =
                        document.getElementById(
                            "password"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    if (
                        password !==
                        confirmPassword
                    ) {

                        e.preventDefault();

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    if (password.length < 8) {

                        e.preventDefault();

                        alert(
                            "Password must be at least 8 characters."
                        );

                    }

                }
            );

    </script>

</body>

</html>
