<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLOUT – Forgot Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #E04F00;
            --black: #020202;
            --white: #FFFFFF;
            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;
            --body: "DM Sans", sans-serif;
        }

        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: var(--black);

            display: flex;
            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top: 1px solid var(--orange);

            border-bottom: 1px solid rgba(255,255,255,.08);

            display: flex;
            align-items: center;
        }

        .nav-container {
            width: min(1380px, calc(100% - 50px));

            margin: auto;

            display: flex;
            align-items: center;
        }

        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: var(--white);
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 400px;

            padding: 32px 36px 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;

            box-shadow:
                0 2px 12px rgba(0,0,0,.02);
        }


        .title {
            font-size: 28px;

            font-weight: 600;

            font-family: var(--heading);

            text-align: center;

            margin-bottom: 10px;
        }


        .description {
            color: #536071;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;

            margin-bottom: 28px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .label {
            display: block;

            font-size: 14px;

            color: #536071;

            font-weight: 500;

            margin-bottom: 5px;
        }

        .input {
            width: 100%;

            height: 40px;

            padding: 0 14px;

            border: 1px solid #d8dce2;

            border-radius: 6px;

            outline: none;

            font-size: 14px;

            background: white;
        }

        .input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(224,79,0,.06);
        }


        /* BUTTON */

        .button {
            width: 100%;

            height: 48px;

            margin-top: 10px;

            border: none;

            font-family: var(--body);

            border-radius: 8px;

            background: var(--orange);

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        .button:hover {
            background: #d34800;
        }


        /* DIVIDER */

        .divider {
            height: 1px;

            background: #e8e8e8;

            margin-top: 22px;
        }


        /* LINKS */

        .bottom-text {
            text-align: center;

            margin-top: 20px;

            color: #536071;

            font-size: 14px;
        }

        .link {
            color: var(--orange);

            text-decoration: none;

            font-weight: 500;
        }

        .link:hover {
            color: #c04400;
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top: 1px solid #e3e3e3;
        }

        .footer-container {
            width: min(950px, calc(100% - 48px));

            margin: auto;
        }

        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            .nav-container {
                width: calc(100% - 36px);
            }

            .card {
                padding: 26px 20px 28px;
            }

            .title {
                font-size: 24px;
            }

            .description {
                font-size: 13px;
            }

            .copyright {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a href="{% url 'index' %}" class="logo">
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">

            <h1 class="title">
                Forgot Password?
            </h1>

            <p class="description">
                Enter the email address associated with
                your account and we'll send you a link
                to reset your password.
            </p>


            <form
                id="forgotForm"
                method="POST"
                action="{% url 'forgot_password' %}"
            >
                {% csrf_token %}

                <div class="form-group">

                    <label
                        class="label"
                        for="email"
                    >
                        Email
                    </label>

                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <button
                    class="button"
                    type="submit"
                >
                    Reset Password
                </button>

            </form>


            <div class="divider"></div>


            <div class="bottom-text">

                Remember your password?

                <a
                    href="{% url 'login' %}"
                    class="link"
                >
                    Sign In
                </a>

            </div>


            <div class="bottom-text">

                Don't have an account?

                <a
                    href="{% url 'register' %}"
                    class="link"
                >
                    Sign Up
                </a>

            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>

</body>

</html>
