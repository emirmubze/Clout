<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLOUT – Forgot Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #E04F00;
            --black: #020202;
            --white: #FFFFFF;
            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;
            --body: "DM Sans", sans-serif;
        }

        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: var(--black);

            display: flex;
            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top: 1px solid var(--orange);

            border-bottom: 1px solid rgba(255,255,255,.08);

            display: flex;
            align-items: center;
        }

        .nav-container {
            width: min(1380px, calc(100% - 50px));

            margin: auto;

            display: flex;
            align-items: center;
        }

        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: var(--white);
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 520px;

            padding: 32px 36px 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;

            box-shadow:
                0 2px 12px rgba(0,0,0,.02);
        }


        .title {
            font-size: 28px;

            font-weight: 600;

            font-family: var(--heading);

            text-align: center;

            margin-bottom: 10px;
        }

        .forgot-illustration {
            display: flex;
            justify-content: center;
            margin: 0 auto 6px;
        }

        .forgot-illustration svg {
            width: 200px;
            height: 110px;
        }


        .description {
            color: #536071;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;

            margin-bottom: 28px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .label {
            display: block;

            font-size: 14px;

            color: #536071;

            font-weight: 500;

            margin-bottom: 5px;
        }

        .input {
            width: 100%;

            height: 40px;

            padding: 0 14px;

            border: 1px solid #d8dce2;

            border-radius: 6px;

            outline: none;

            font-size: 14px;

            background: white;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input {
            padding-left: 48px;
        }

        .field-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            width: 18px;
            height: 18px;
            color: #8D939B;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .field-icon path,
        .field-icon circle {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px rgba(224,79,0,.06);
        }


        /* BUTTON */

        .button {
            width: 100%;

            height: 48px;

            margin-top: 10px;

            border: none;

            font-family: var(--body);

            border-radius: 8px;

            background: var(--orange);

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        .button-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -4px;
            fill: currentColor;
        }

        .button:hover {
            background: #d34800;
        }


        /* DIVIDER */

        .divider {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 22px;
            color: #6B7280;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e8e8e8;
        }


        /* LINKS */

        .bottom-text {
            text-align: center;

            margin-top: 20px;

            color: #536071;

            font-size: 14px;
        }

        .back-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            margin-top: 20px;
            border: 1px solid #d8dce2;
            border-radius: 8px;
            color: #202020;
            font-size: 16px;
            text-decoration: none;
        }

        .back-button:hover {
            border-color: var(--orange);
            color: var(--orange);
        }

        .support-text {
            margin-top: 24px;
        }

        .link {
            color: var(--orange);

            text-decoration: none;

            font-weight: 500;
        }

        .link:hover {
            color: #c04400;
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top: 1px solid #e3e3e3;
        }

        .footer-container {
            width: min(950px, calc(100% - 48px));

            margin: auto;
        }

        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width: calc(100% - 36px);
            }

            .card {
                padding: 26px 20px 28px;
            }

            .title {
                font-size: 24px;
            }

            .description {
                font-size: 13px;
            }

            .forgot-illustration svg {
                width: 190px;
                height: 105px;
            }

            .copyright {
                font-size: 13px;
            }
        }

    </style>

<link rel="stylesheet" href="/static/responsive.css">
</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a href="{% url 'index' %}" class="logo">
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">

            <div class="forgot-illustration" aria-hidden="true">
                <svg viewBox="0 0 120 120">
                    <circle cx="60" cy="48" r="31" fill="#FFF0F0" />
                    <path d="M35 42h53v43H35z" fill="none" stroke="#F5B9B9" stroke-width="2" />
                    <path d="m36 43 25 21 26-21" fill="none" stroke="#F5B9B9" stroke-width="2" />
                    <path d="M43 54h27M43 64h34M43 74h28" stroke="#9CA3AF" stroke-width="2" />
                    <rect x="70" y="66" width="29" height="31" rx="6" fill="#E04F00" />
                    <path d="M76 66v-6a8.5 8.5 0 0 1 17 0v6" fill="none" stroke="#E04F00" stroke-width="5" />
                    <circle cx="84.5" cy="80" r="3" fill="#FFF" />
                    <path d="M84.5 82v6" stroke="#FFF" stroke-width="2" />
                </svg>
            </div>

            <h1 class="title">
                Forgot Password?
            </h1>

            <p class="description">
                No worries! Enter your email or username and
                we'll send you a link to reset your password.
            </p>


            <form
                id="forgotForm"
                method="POST"
                action="{% url 'forgot_password' %}"
            >
                {% csrf_token %}

                <div class="form-group">

                    <label
                        class="label"
                        for="email"
                    >
                        Email or Username
                    </label>

                    <div class="input-wrap">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.5" />
                            <path d="M5 20c.7-3.1 3.1-5 7-5s6.3 1.9 7 5" />
                        </svg>
                        <input class="input" type="text" id="email" name="email" placeholder="Enter your email or username" autocomplete="username" required>
                    </div>

                </div>


                <button
                    class="button"
                    type="submit"
                >
                    <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 11 18-8-5 18-5-7-8-3Z" />
                        <path d="m11 14 4-5" fill="none" stroke="#FFF" stroke-width="1.5" />
                    </svg>
                    Send Reset Link
                </button>

            </form>


            <div class="divider"><span>or</span></div>


            <a href="{% url 'login' %}" class="back-button">←&nbsp;&nbsp; Back to Login</a>

            <div class="bottom-text support-text">
                Still having trouble?
                <a href="{% url 'contact' %}" class="link">Contact our support</a>
            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>

</body>

</html>
