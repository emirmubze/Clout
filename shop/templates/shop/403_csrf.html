{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Session Timed Out — CLOUT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#020202">

<!-- Favicon / Site Icon -->
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}?v=5">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}?v=5">
<link rel="shortcut icon" href="/favicon.ico?v=5">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
    --brand: #E04F00;
    --brand-hover: #c84300;
    --brand-light: #fff4ed;
    --brand-glow: rgba(224, 79, 0, 0.2);
    --dark: #090d16;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --radius-xl: 20px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --shadow-card: 0 16px 40px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.04);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Plus Jakarta Sans", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f8fafc;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}

.navbar {
    height: 64px;
    background: var(--dark);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-container {
    width: min(1240px, calc(100% - 48px));
    height: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-img {
    height: 28px;
    width: auto;
    object-fit: contain;
    display: block;
}

.back-home {
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: var(--radius-sm);
    padding: 7px 15px;
    background: rgba(255, 255, 255, 0.04);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.2s ease;
}

.back-home:hover {
    background: var(--brand);
    border-color: var(--brand);
    color: #ffffff;
}

.main {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 38px 34px 34px;
    box-shadow: var(--shadow-card);
    text-align: center;
    animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: #fff7ed;
    color: #ea580c;
    border: 1px solid #ffedd5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.card-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--dark);
    letter-spacing: -0.4px;
    margin-bottom: 8px;
}

.card-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: 24px;
}

.action-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, #FF6611 0%, #E04F00 100%);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    box-shadow: 0 4px 16px var(--brand-glow);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 12px;
}

.action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(224, 79, 0, 0.35);
}

.secondary-btn {
    width: 100%;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: #ffffff;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.secondary-btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
}

.footer {
    height: 60px;
    background: #ffffff;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: auto;
    flex-shrink: 0;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'index' %}" class="logo" aria-label="CLOUT Home">
            <img src="{% static 'logo.png' %}" alt="CLOUT" class="logo-img">
        </a>
        <a href="{% url 'index' %}" class="back-home">
            <i class="fa-solid fa-house" style="font-size:12px;"></i>
            <span>Home</span>
        </a>
    </div>
</nav>

<main class="main">
    <div class="card">
        <div class="card-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="card-title">Session Expired</h1>
        <p class="card-subtitle">
            Your security verification token expired or your browser refreshed. Please sign in again to continue safely.
        </p>

        <a href="{% url 'login' %}" class="action-btn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>Log In Again</span>
        </a>

        <a href="{% url 'index' %}" class="secondary-btn">
            <span>Return to Home</span>
        </a>
    </div>
</main>

<footer class="footer">
    <div>&copy; 2026 Clout. All rights reserved.</div>
</footer>

</body>
</html>
