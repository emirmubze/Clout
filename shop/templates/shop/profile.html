<!DOCTYPE html>
<html lang="en">

<head>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CLOUT – Profile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #E04F00;
            --black: #020202;
            --white: #FFFFFF;
            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;
            --body: "DM Sans", sans-serif;
        }

        body {
            background: var(--white);
            font-family: var(--body);
            color: var(--black);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            height: 62px;
            background: var(--black);
            border-top: 1px solid var(--orange);
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
        }

        .nav-container {
            width: min(1380px, calc(100% - 50px));
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: var(--orange);
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            font-family: var(--heading);
            letter-spacing: 1.5px;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 2px solid #f4996870;
            border-radius: 15px;
            box-shadow: 0 20px 45px rgba(0,0,0,.045);
            padding: 40px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 600;
            font-family: var(--heading);
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: -0.2px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 32px;
        }

        /* Crop Modal Styles */
        .crop-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .crop-modal.active {
            display: flex;
        }

        .crop-modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .crop-modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .crop-container {
            margin-bottom: 20px;
        }

        .crop-preview {
            max-width: 100%;
            max-height: 400px;
        }

        .crop-modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .crop-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .crop-btn-confirm {
            background: var(--orange);
            color: white;
        }

        .crop-btn-confirm:hover {
            background: #d65100;
        }

        .crop-btn-cancel {
            background: #f0ede6;
            color: var(--black);
            border: 1px solid #e8dcd0;
        }

        .crop-btn-cancel:hover {
            background: #e8dcd0;
        }

        .profile-image-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            background: #f0ede6;
            border: 3px solid var(--orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .profile-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            margin-bottom: 24px;
        }

        .info-row {
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-label {
            color: #536071;
            font-weight: 600;
        }

        .info-value {
            color: var(--black);
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #536071;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 16px;
            background: var(--orange);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition: background 0.2s ease;
        }

        .file-input-label:hover {
            background: #d65100;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
        }

        .btn-primary:hover {
            background: #d65100;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0ede6;
            color: var(--black);
            border: 1px solid #e8dcd0;
        }

        .btn-secondary:hover {
            background: #e8dcd0;
        }

        .btn-danger {
            background: #f5c4bc;
            color: #b42318;
            border: 1px solid #eab0a0;
        }

        .btn-danger:hover {
            background: #eab0a0;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--orange);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .footer {
            background: var(--black);
            color: #777;
            text-align: center;
            padding: 27px 20px;
            flex-shrink: 0;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'index' %}"
                class="logo"
            >
                CLOUT
            </a>

        </div>

    </nav>

    <!-- MAIN -->

    <main class="main">

        <div class="card">

            <h1 class="card-title">
                Profile
            </h1>

            <div class="profile-section">

                <div class="profile-image-container">
                    {% if user.profile_image %}
                        <img src="{{ user.profile_image.url }}" alt="Profile">
                    {% else %}
                        <span>👤</span>
                    {% endif %}
                </div>

                <div class="profile-info">

                    <div class="info-row">
                        <span class="info-label">Name:</span>
                        <span class="info-value">{{ user.name }}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Username:</span>
                        <span class="info-value">{{ user.username }}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Email:</span>
                        <span class="info-value">{{ user.email }}</span>
                    </div>

                </div>

            </div>

            <!-- UPLOAD FORM -->

            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">

                    <div class="file-input-wrapper">
                        <input
                            type="file"
                            id="profile_image"
                            name="profile_image"
                            accept="image/*"
                        >
                        <label for="profile_image" class="file-input-label">
                             Upload Profile Picture
                        </label>
                    </div>

                </div>

                <input type="hidden" id="croppedImageData" name="cropped_image_data">

            </form>

            <!-- REMOVE IMAGE BUTTON -->
            {% if user.profile_image %}

                <form method="POST" style="margin-top: 12px;">
                    {% csrf_token %}

                    <button
                        type="submit"
                        name="remove_image"
                        class="btn btn-danger"
                        style="width: 100%;"
                    >
                        Remove Picture
                    </button>

                </form>

            {% endif %}

            <!-- BACK LINK -->

            <div class="back-link">
                <a href="{% url 'index' %}">
                    ← Back to Home
                </a>
            </div>

        </div>

    </main>

    <!-- CROP MODAL -->
    <div id="cropModal" class="crop-modal">
        <div class="crop-modal-content">
            <div class="crop-modal-title">Crop Your Profile Picture</div>
            <div class="crop-container">
                <img id="cropImage" class="crop-preview" src="" alt="Crop Preview">
            </div>
            <div class="crop-modal-buttons">
                <button type="button" class="crop-btn crop-btn-confirm" id="cropConfirmBtn">Save & Upload</button>
                <button type="button" class="crop-btn crop-btn-cancel" id="cropCancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let cropper = null;
        const profileImageInput = document.getElementById('profile_image');
        const cropModal = document.getElementById('cropModal');
        const cropImage = document.getElementById('cropImage');
        const uploadForm = document.getElementById('uploadForm');
        const croppedImageDataInput = document.getElementById('croppedImageData');

        // Handle file selection
        profileImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    cropImage.src = event.target.result;
                    cropModal.classList.add('active');
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    cropper = new Cropper(cropImage, {
                        aspectRatio: 1,
                        viewMode: 1,
                        autoCropArea: 1,
                        responsive: true,
                        guides: true,
                        highlight: true,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: true,
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle crop confirm
        document.getElementById('cropConfirmBtn').addEventListener('click', function() {
            const canvas = cropper.getCroppedCanvas({
                maxWidth: 4096,
                maxHeight: 4096,
                fillColor: '#fff',
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // Convert canvas to blob and create a file
            canvas.toBlob(function(blob) {
                const dataTransfer = new DataTransfer();
                const file = new File([blob], 'cropped-profile.jpg', { type: 'image/jpeg' });
                dataTransfer.items.add(file);
                profileImageInput.files = dataTransfer.files;

                // Submit the form
                uploadForm.submit();
            }, 'image/jpeg', 0.95);

            cropModal.classList.remove('active');
        });

        // Handle crop cancel
        document.getElementById('cropCancelBtn').addEventListener('click', function() {
            cropModal.classList.remove('active');
            profileImageInput.value = '';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        });
    </script>

</body>

</html>
