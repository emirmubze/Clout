<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLOUT – Password Changed</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        :root {
            --orange: #E04F00;

            --black: #020202;

            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;

            --body: "DM Sans", sans-serif;
        }


        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: #020202;

            display: flex;

            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top:
                1px solid var(--orange);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            display: flex;

            align-items: center;
        }


        .nav-container {
            width:
                min(1380px, calc(100% - 50px));

            margin: auto;
        }


        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: white;
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 520px;

            padding: 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;

            text-align: center;
        }

        .success-illustration {
            display: flex;
            justify-content: center;
            margin: 0 auto 6px;
        }

        .success-illustration svg {
            width: 200px;
            height: 130px;
        }


        .title {
            font-size: 28px;

            font-family: var(--heading);

            margin-bottom: 8px;
        }


        .description {
            color: #536071;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 22px;
        }

        .security-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 4px 0 22px;
            padding: 16px;
            border: 1px solid #F2D8CB;
            border-radius: 10px;
            background: #FFF7F2;
            color: #536071;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
        }

        .security-box strong {
            display: block;
            margin-bottom: 3px;
            color: #202020;
        }

        .security-box svg {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            color: var(--orange);
        }


        .button {
            display: block;

            width: 100%;

            height: 48px;

            line-height: 48px;

            background: var(--orange);

            font-family: var(--body);

            color: white;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;
        }


        .button:hover {
            background: #C2410C;
        }

        .button-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -4px;
            fill: currentColor;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            color: #536071;
            font-size: 16px;
            text-decoration: none;
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top:
                1px solid #e3e3e3;
        }


        .footer-container {
            width:
                min(950px, calc(100% - 48px));

            margin: auto;
        }


        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width:
                    calc(100% - 36px);
            }


            .card {
                padding:
                    28px 20px;
            }


            .title {
                font-size: 24px;
            }


            .copyright {
                font-size: 13px;
            }

        }

    </style>

<link rel="stylesheet" href="/static/responsive.css">
</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'index' %}"
                class="logo"
            >
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">

            <div class="success-illustration" aria-hidden="true">
                <svg viewBox="0 0 200 130">
                    <circle cx="100" cy="61" r="43" fill="#FFF0E8" />
                    <circle cx="100" cy="61" r="31" fill="#E04F00" />
                    <path d="m83 61 12 12 24-27" fill="none" stroke="#FFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="46" cy="58" r="3" fill="#E04F00" opacity=".6" />
                    <circle cx="153" cy="43" r="3" fill="#E04F00" opacity=".6" />
                    <path d="M67 29v12M61 35h12M144 82v10M139 87h10" stroke="#E04F00" stroke-width="2" stroke-linecap="round" opacity=".65" />
                </svg>
            </div>


            <h1 class="title">
                Password Reset Successful!
            </h1>


            <p class="description">
                Your password has been changed successfully.
                You can now login with your new password.
            </p>

            <div class="security-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 21 6v5c0 5.2-3.7 8.8-9 10-5.3-1.2-9-4.8-9-10V6l9-3Z" />
                    <path d="m8 12 2.5 2.5L16 9" />
                </svg>
                <span>
                    <strong>You're all set!</strong>
                    Your account is secure. Don't forget to keep your password safe and never share it with anyone.
                </span>
            </div>


            <a
                href="{% url 'login' %}"
                class="button"
            >
                <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
                Go to Login
            </a>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>


</body>

</html>
