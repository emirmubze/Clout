<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CLOUT – Password Changed</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Acme&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        :root {
            --orange: #E04F00;

            --black: #020202;

            --off-white: #FBF8F4;

            --heading: "Acme", sans-serif;

            --body: "DM Sans", sans-serif;
        }


        body {
            min-height: 100vh;

            background: var(--off-white);

            font-family: var(--body);

            color: #020202;

            display: flex;

            flex-direction: column;
        }


        /* NAVBAR */

        .navbar {
            height: 62px;

            background: var(--black);

            border-top:
                1px solid var(--orange);

            border-bottom:
                1px solid rgba(255,255,255,.08);

            display: flex;

            align-items: center;
        }


        .nav-container {
            width:
                min(1380px, calc(100% - 50px));

            margin: auto;
        }


        .logo {
            color: var(--orange);

            font-family: var(--heading);

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 1.5px;

            text-decoration: none;
        }


        /* MAIN */

        .main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background: white;
        }


        /* CARD */

        .card {
            width: 100%;

            max-width: 400px;

            padding: 36px;

            background: white;

            border: 1px solid #e1e1e1;

            border-radius: 10px;

            text-align: center;
        }


        .success-icon {
            width: 64px;

            height: 64px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #edf8ef;

            color: #28733a;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            font-weight: bold;
        }


        .title {
            font-size: 28px;

            font-family: var(--heading);

            margin-bottom: 12px;
        }


        .description {
            color: #536071;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


        .button {
            display: block;

            width: 100%;

            height: 48px;

            line-height: 48px;

            background: var(--orange);

            font-family: var(--body);

            color: white;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;
        }


        .button:hover {
            background: #d34800;
        }


        /* FOOTER */

        .footer {
            height: 80px;

            background: var(--off-white);

            border-top:
                1px solid #e3e3e3;
        }


        .footer-container {
            width:
                min(950px, calc(100% - 48px));

            margin: auto;
        }


        .copyright {
            padding-top: 30px;

            font-size: 18px;
        }


        @media (max-width: 500px) {

            body {
                min-height: 100svh;
                overflow-x: hidden;
            }

            .main {
                width: 100%;
            }

            .footer {
                height: auto;
                min-height: 64px;
                padding: 14px 18px max(14px, env(safe-area-inset-bottom));
                display: flex;
                align-items: center;
            }

            .footer-container {
                width: 100%;
                min-height: 34px;
            }

            .copyright {
                padding-top: 0;
            }

            .nav-container {
                width:
                    calc(100% - 36px);
            }


            .card {
                padding:
                    28px 20px;
            }


            .title {
                font-size: 24px;
            }


            .copyright {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="nav-container">

            <a
                href="{% url 'index' %}"
                class="logo"
            >
                CLOUT
            </a>

        </div>

    </nav>


    <main class="main">

        <div class="card">


            <div class="success-icon">
                ✓
            </div>


            <h1 class="title">
                Password Changed
            </h1>


            <p class="description">
                Your password has been successfully
                changed. You can now sign in using
                your new password.
            </p>


            <a
                href="{% url 'login' %}"
                class="button"
            >
                Sign In
            </a>


        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <div class="copyright">
                © 2026 Clout
            </div>

        </div>

    </footer>


</body>

</html>
